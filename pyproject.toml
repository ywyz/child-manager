[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[project]
name = "child-manager"
version = "0.1.0"
description = "幼儿园一日活动计划管理系统"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.19.0",
    "boto3>=1,<2",
    "chinesecalendar>=1.11,<2",
    "cryptography>=49,<50",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
    "pydantic>=2.12,<3",
    "pyside6>=6.11,<6.12",
    "python-docx>=1.2,<2",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9.0.3,<9.1",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "kindergarten_manager"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --confcutdir=tests/desktop"
testpaths = ["tests/desktop"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src/kindergarten_manager", "tests/desktop"]
exclude = ["graphify-out"]
