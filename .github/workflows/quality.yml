name: quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - name: Install PySide6 runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libegl1
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
